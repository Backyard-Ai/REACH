# Fly.io configuration for the REACH Directus admin dashboard.
# Deploy:  fly deploy
# The app connects to our Supabase database via the session pooler.

app = "reach-directus"
primary_region = "iad"

[build]
  image = "directus/directus:11"

[env]
  PORT = "8055"
  DB_CLIENT = "postgres"
  DB_HOST = "aws-0-us-west-2.pooler.supabase.com"
  DB_PORT = "5432"
  DB_USER = "directus.htzmessdmdtonjybqvth"
  DB_DATABASE = "postgres"
  WEBSOCKETS_ENABLED = "false"

[http_service]
  internal_port = 8055
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 30

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
